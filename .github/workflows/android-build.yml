name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.9'
  KTLINT_VERSION: '1.8.0'
  KTLINT_SHA256: 'a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75'

# Action versions are pinned to full commit SHAs (the comment shows the release).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Colour and Material rules
        run: sh scripts/check-colors.sh

      - name: ktlint
        run: |
          curl -sSfL -o ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  ktlint" | sha256sum -c -
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" "*.kts" "app/*.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: sh scripts/accept-sdk-licenses.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Android Lint
        run: gradle :app:lintDebug --console=plain --no-daemon

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  test:
    name: Type-check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: sh scripts/accept-sdk-licenses.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Compiling both source sets is the Kotlin type-check; then the unit tests run.
      - name: Compile (type-check) and run unit tests
        run: gradle :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:testDebugUnitTest --console=plain --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Build APKs
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: sh scripts/accept-sdk-licenses.sh

      # llama.cpp and whisper.cpp are pinned by commit and cached, never committed to the repo.
      - name: Cache native sources
        id: native-src
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/src/main/cpp/third_party
          key: native-src-${{ hashFiles('scripts/fetch-native-deps.sh') }}

      - name: Fetch native sources
        run: sh scripts/fetch-native-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --console=plain --no-daemon 2>&1 | tee build.log

      # Fail loudly if the native engine did not make it into the APK.
      - name: Verify native libraries are packaged
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            unzip -l "$apk" | tee apk-contents.txt | grep -E 'lib/arm64-v8a/libcopilot_native\.so'
            unzip -l "$apk" | grep -E 'lib/arm64-v8a/libggml-cpu' > /dev/null
          done

      - name: Show build errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Could not' -A2 build.log | head -80 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/InterviewCopilot-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/InterviewCopilot-release.apk
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InterviewCopilot-debug-apk
          path: dist/InterviewCopilot-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InterviewCopilot-release-apk
          path: dist/InterviewCopilot-release.apk
          if-no-files-found: error

      # Publishes the APKs on the repo's Releases page. Never fails the build.
      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          name: Interview Copilot build ${{ github.run_number }}
          body: Download **InterviewCopilot-release.apk** (or the debug one) and install it on your Android phone.
          files: |
            dist/InterviewCopilot-debug.apk
            dist/InterviewCopilot-release.apk
